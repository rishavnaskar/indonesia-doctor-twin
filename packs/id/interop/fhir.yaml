# Interoperability pack — the national exchange profile.
#
# The exchange format is a BOUNDARY, not our canonical model. We map outward at
# the edge and never let a wire format dictate the internal clinical
# representation (SPEC-V1 §3, design rule 3).
#
# Everything national lives here: endpoints, identifier systems, profile URLs.
# /service/emit builds bundles generically from this config, which is why that
# module can name no country and no payer.

version: "id-interop-2026-08"

exchange:
  fhir_version: "R4"
  bundle_type: "transaction"
  # Sandbox only. No production endpoint is committed to this repository.
  base_url: "https://api-staging.example/fhir-r4/v1"
  auth: "oauth2_client_credentials"

# ICD-10, ICD-9-CM and LOINC are international. The organisation, practitioner
# and patient identifier systems are national, which is why they live here.
systems:
  icd10: "http://hl7.org/fhir/sid/icd-10"
  icd9cm: "http://hl7.org/fhir/sid/icd-9-cm"
  loinc: "http://loinc.org"
  organisation: "http://sys-ids.kemkes.go.id/organization"
  practitioner: "http://sys-ids.kemkes.go.id/practitioner"
  patient: "http://sys-ids.kemkes.go.id/patient"

# The observations any pathway in this pack may emit.
#
# `display` is deliberately absent. The official validator rejects a display
# that is not the code's registered name — we had "Glomerular filtration rate"
# against LOINC 62238-1, whose real name is far longer — and a wrong display is
# worse than none, because a reader believes it. FHIR permits omitting it.
#
# `vital_sign: true` marks the codes the FHIR vital-signs profiles govern; those
# require Observation.category to carry the vital-signs slice.
observation_codes:
  sbp:   {loinc: "8480-6",  unit: "mm[Hg]",           vital_sign: true}
  dbp:   {loinc: "8462-4",  unit: "mm[Hg]",           vital_sign: true}
  k:     {loinc: "2823-3",  unit: "mmol/L"}
  egfr:  {loinc: "62238-1", unit: "mL/min/{1.73_m2}"}
  hba1c: {loinc: "4548-4",  unit: "%"}

# A systolic or diastolic code on its own triggers the FHIR blood-pressure
# profile, which requires the panel code with both readings as components. Two
# separate Observations is not a legal representation of a blood pressure, and
# the validator says so in six separate errors.
blood_pressure_panel:
  loinc: "85354-9"
  systolic: sbp
  diastolic: dbp

encounter:
  class_code: "AMB"
  class_display: "ambulatory"
  status: "finished"
