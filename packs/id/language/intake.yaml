# The intake interview — bounded, in Bahasa Indonesia.
#
# A structured interviewer, not an advisor. Fixed schema, fixed question set,
# and no negotiation of clinical conclusions with the patient.
#
# The reason this is a closed question set rather than a conversation is
# evidence, not caution. Under multi-turn pressure roughly half of medical
# model configurations capitulate to a confidently wrong patient premise, and
# symptom triage is the worst category of all. Anti-sycophancy prompting buys
# only a little. A system that cannot be argued with, because it has no clinical
# voice to argue from, is not vulnerable to that failure at all.
#
# The interviewer collects. The doctor decides. Nothing in this file gives an
# answer to a clinical question, and nothing should ever be added that does.

version: "id-intake-2026-08"

# What language the system writes patient-facing text in. Here rather than in
# the prompt builder, because /service is not allowed to name a language any
# more than it is allowed to name a drug — and because a second deployment
# changes this line rather than a source file.
output_language: "Bahasa Indonesia"

# Returned verbatim for ANY request for advice, reassurance, a diagnosis, or a
# medication decision. Never varied, never softened, never elaborated.
deflection:
  text: >-
    Maaf, saya tidak dapat memberikan saran medis. Pertanyaan Anda akan saya
    catat dan sampaikan kepada dokter.
  gloss: >-
    I am not able to give medical advice. I will record your question and pass
    it to the doctor.

closing:
  text: "Terima kasih. Jawaban Anda sudah dicatat untuk dokter."
  gloss: "Thank you. Your answers have been recorded for the doctor."

# Every question is closed or numeric. There is no free-text clinical question,
# because a free-text clinical question invites a clinical answer.
questions:
  - id: adherence
    field: adherence
    type: choice
    text: "Dalam 4 minggu terakhir, seberapa sering Anda minum obat tekanan darah?"
    gloss: "In the last 4 weeks, how often did you take your blood pressure medicine?"
    options:
      - {value: always,    text: "Setiap hari"}
      - {value: mostly,    text: "Hampir setiap hari"}
      - {value: sometimes, text: "Kadang-kadang"}
      - {value: stopped,   text: "Sudah berhenti"}

  - id: side_effects
    field: side_effects
    type: multi_choice
    text: "Apakah Anda mengalami keluhan berikut sejak kunjungan terakhir?"
    gloss: "Have you had any of these since your last visit?"
    options:
      - {value: cough,       text: "Batuk kering"}
      - {value: dizziness,   text: "Pusing"}
      - {value: swelling,    text: "Kaki bengkak"}
      - {value: none,        text: "Tidak ada"}

  - id: red_flag_symptoms
    field: symptoms
    type: multi_choice
    text: "Apakah Anda mengalami hal berikut?"
    gloss: "Have you experienced any of the following?"
    # These map onto the red-flag rules. A yes here routes the encounter, and
    # the routing is done by the rules, not by the interviewer.
    options:
      - {value: chest_pain,                text: "Nyeri dada"}
      - {value: dyspnoea,                  text: "Sesak napas"}
      - {value: severe_headache,           text: "Sakit kepala hebat"}
      - {value: visual_disturbance,        text: "Gangguan penglihatan"}
      - {value: focal_neurological_deficit, text: "Lemah separuh badan"}
      - {value: syncope,                   text: "Pingsan"}
      - {value: none,                      text: "Tidak ada"}

  - id: home_bp
    field: home_bp
    type: numeric_pair
    text: "Jika Anda mengukur tekanan darah di rumah, berapa hasil terakhir?"
    gloss: "If you measure your blood pressure at home, what was the last reading?"
    optional: true
    range: {min: 50, max: 300}

  - id: outside_medication
    field: outside_medication
    type: choice
    text: "Apakah Anda minum obat lain dari luar rumah sakit ini?"
    gloss: "Are you taking any other medicine from outside this hospital?"
    options:
      - {value: none,     text: "Tidak"}
      - {value: painkiller, text: "Ya, obat nyeri"}
      - {value: herbal,   text: "Ya, jamu atau herbal"}
      - {value: other,    text: "Ya, lainnya"}

# SPEC-V1 §5.8 — what the clinician reads, per band.
#
# Here rather than in /service/present for the same reason the deflection text
# is here: the engine may not name a language. A second country changes this
# block, not a source file.
#
# Green has a headline but the surface never shows it. It exists so the audit
# view can say what the system concluded while staying silent.
presentation:
  bands:
    green: "Tidak ada catatan"
    amber: "Perlu diperiksa"
    red: "Perlu tindakan"
  headlines:
    escalate: "Tanda bahaya — rujuk segera, tidak ada draf"
    referral: "Rencana ini tidak dapat dijalankan di sini — perlu rujukan"
    handoff: "Pasien ini di luar alur hipertensi dewasa"
    request_info: "Data belum cukup untuk memberi saran"
    abstain: "Sistem tidak mengeluarkan draf untuk kunjungan ini"
    warnings: "Draf tersedia, dengan catatan"
    clean: "Draf tersedia"
  glosses:
    escalate: "Red flag — refer immediately, no draft"
    referral: "This plan cannot be delivered here — referral needed"
    handoff: "This patient is outside the adult hypertension pathway"
    request_info: "Not enough information to advise"
    abstain: "The system produced no draft for this visit"
    warnings: "Draft available, with notes"
    clean: "Draft available"

# SPEC-V1 §5.3 — what an intake answer means for reconciliation.
#
# The interviewer collects; it does not interpret. This block is the
# interpretation, and it lives in the pack because "a painkiller" implicating
# the NSAID class is a clinical and national judgement, not an engine one.
#
# Nothing here resolves a discrepancy. Each entry only says what to *tell the
# clinician*, and which drug class to consider alongside what the record already
# holds. A patient saying they stopped a drug never removes it from the record.
reconciliation:
  outside_medication:
    painkiller:
      kind: outside_prescription
      implicates_class: nsaid
      text: "Patient reports taking a painkiller obtained outside this hospital."
      gloss: "Patient reports taking a painkiller obtained outside this hospital."
    herbal:
      kind: outside_prescription
      text: "Patient reports taking jamu or a herbal preparation. Contents unknown."
      gloss: "Patient reports taking jamu or a herbal preparation. Contents unknown."
    other:
      kind: outside_prescription
      text: "Patient reports another medicine from outside this hospital."
      gloss: "Patient reports another medicine from outside this hospital."
  adherence:
    stopped:
      kind: stopped_medication
      material: true
      text: "Patient reports having stopped their blood-pressure medication."
      gloss: "Patient reports having stopped their blood-pressure medication."
    sometimes:
      kind: adherence_gap
      material: true
      text: "Patient reports taking their medication only sometimes."
      gloss: "Patient reports taking their medication only sometimes."
    mostly:
      kind: adherence_gap
      text: "Patient reports missing doses on some days."
      gloss: "Patient reports missing doses on some days."
  # Phrasing for discrepancies the engine derives by comparison rather than
  # from an answer.
  derived:
    dose_differs:
      text: "The dose the patient describes does not match the record."
      gloss: "The dose the patient describes does not match the record."
    not_in_record:
      text: "The patient reports a medicine that is not on their record."
      gloss: "The patient reports a medicine that is not on their record."
    missing_from_report:
      text: "The record lists a medicine the patient did not mention."
      gloss: "The record lists a medicine the patient did not mention."
