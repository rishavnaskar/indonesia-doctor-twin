version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # One pull request for the tools, which move often and matter least.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "pip-audit", "types-*", "coverage"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
