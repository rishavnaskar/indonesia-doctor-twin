[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --strict-config
filterwarnings =
    error::DeprecationWarning:service.*
    default

# Coverage is configured in pyproject.toml under [tool.coverage]. The floor CI
# enforces is fail_under = 60 there; run it locally with
#
#     pytest --cov --cov-report=term-missing
